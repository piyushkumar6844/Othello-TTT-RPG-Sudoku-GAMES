<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Othello - Multiplayer + Single Player (Minimax AI)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div id="blackScore">Black Score: 2</div>

      <div id="reversiBoard">
        <!-- 8x8 squares (8th rank first) -->
        <!-- We'll keep the same structure: 64 .square divs in order -->
        <!-- 8th rank -->
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <!-- 7th rank -->
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <!-- 6th -->
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <!-- 5th -->
        <div class="square"></div><div class="square"></div><div class="square"></div>
        <div class="square">
          <div class="piece" color="white"><img src="white-disc.png" alt="white disc"></div>
        </div>
        <div class="square">
          <div class="piece" color="black"><img src="black-disc.png" alt="black disc"></div>
        </div>
        <div class="square"></div><div class="square"></div><div class="square"></div>
        <!-- 4th -->
        <div class="square"></div><div class="square"></div><div class="square"></div>
        <div class="square">
          <div class="piece" color="black"><img src="black-disc.png" alt="black disc"></div>
        </div>
        <div class="square">
          <div class="piece" color="white"><img src="white-disc.png" alt="white disc"></div>
        </div>
        <div class="square"></div><div class="square"></div><div class="square"></div>
        <!-- 3rd -->
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <!-- 2nd -->
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <!-- 1st -->
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
        <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
      </div>

      <div id="whiteScore">White Score: 2</div>

      <div id="controls">
        <button id="reset">Reset</button>
        <div id="modeSelect">
          <button id="multiBtn" class="mode active">Multiplayer</button>
          <button id="singleBtn" class="mode">Single Player (vs AI)</button>
        </div>
      </div>
    </div>

    <div id="alert"></div>

    <script src="script.js"></script>
  </body>
</html>
